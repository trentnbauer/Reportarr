# Every variable is optional: anything left out can be set in the web UI instead.
# A variable set here is locked in the UI (env wins over the UI).
services:
  app:
    image: ghcr.io/trentnbauer/reportarr:latest
    restart: unless-stopped
    ports:
      - ${WEB_UI:-8080}:8080
    volumes:
      - data:/data
    environment:
      PLEX_URL: ${PLEX_URL:-http://plex:32400}
      PLEX_TOKEN: ${PLEX_TOKEN}
      DRY_RUN: ${DRY_RUN:-true}            # set "false" to actually delete and re-download
      POLL_SECONDS: ${POLL_SECONDS:-60}
      MAX_PER_DAY: ${MAX_PER_DAY:-48}
      UI_USERNAME: ${UI_USERNAME}
      UI_PASSWORD: ${UI_PASSWORD}
      ARRS: >-
        [{
          "name":"sonarr",
          "kind":"sonarr",
          "url":"${SONARR_URL}",
          "key":"${SONARR_KEY}"
        },
         {
         "name":"radarr",
         "kind":"radarr",
         "url":"${RADARR_URL}",
         "key":"${RADARR_KEY}"
        }]
      # Optional, but needed to move the replacement to the top of the download queue: Sonarr/Radarr
      # hide their download clients' passwords and API keys, so Reportarr can't borrow them.
      # Leave blank to skip queue priority (the replacement still downloads). URL and username fall back
      # to the host/username from each Sonarr/Radarr download client. Use SABnzbd's full API key, not the NZB key.
      QBIT_URL: ${QBIT_URL:-}
      QBIT_USERNAME: ${QBIT_USERNAME:-}
      QBIT_PASSWORD: ${QBIT_PASSWORD:-}
      SAB_URL: ${SAB_URL:-}
      SAB_API_KEY: ${SAB_API_KEY:-}
    # The service names in PLEX_URL/ARRS only resolve if this stack shares a network with them. If Plex and the
    # *arrs live in other compose projects, join their network (or use host IPs in the URLs above):
    # networks: [media]
volumes:
  data:
# networks:
#   media:
#     external: true
