# Settings come from a .env file: copy .env.example to .env, or configure Reportarr in the web UI and use
# "Download .env" there. Every variable in .env reaches the container, so adding SONARR_3_URL, RADARR_4_KEY and so on
# needs no change to this file. Anything set in .env is read-only in the web UI.
services:
  app:
    image: ghcr.io/trentnbauer/reportarr:latest
    restart: unless-stopped
    ports:
      - ${WEB_UI:-8080}:8080
    volumes:
      - data:/data
    env_file:
      - path: .env
        required: false # without a .env, configure everything in the web UI
    # The hostnames in .env (for example http://sonarr_1:8989) only resolve if this stack shares a network with them.
    # If Plex and the *arrs live in other compose projects, join their network (or use host IPs in the URLs):
    # networks: [media]
volumes:
  data:
# networks:
#   media:
#     external: true
